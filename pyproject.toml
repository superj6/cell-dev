[project]
name = "cell-dev"
version = "0.1.0"
description = "Evolve developmental genomes that grow a spiking cell tissue on a lattice and solve tasks by local message passing"
requires-python = ">=3.10"
dependencies = []  # see requirements.txt (torch: CPU wheel locally)

[project.optional-dependencies]
develop = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long whole-life tests and gates, deselected by default (run with -m slow)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008", "B905"]
